<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio Creativo — Desarrollo web, apps y automatización | Lima, Perú</title>
    <meta name="description" content="Desarrollo web, aplicaciones móviles, automatizaciones y backend. Explora nuestro portafolio como un libro: proyectos publicados, servicios y planes de mantenimiento.">
    <link rel="canonical" href="https://dsrvin.github.io/portafolio-libro/">
    <meta name="theme-color" content="#C8A87C">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%235B3A29'/><rect x='7' y='7' width='10' height='10' rx='1.5' fill='none' stroke='%23E8DCCB' stroke-width='2'/></svg>">

    <!-- Tarjeta al compartir el enlace (WhatsApp, LinkedIn, X) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Estudio Creativo — Portafolio interactivo">
    <meta property="og:description" content="Desarrollo web, apps móviles y automatizaciones. Explóralo como un libro: pasa las páginas.">
    <meta property="og:url" content="https://dsrvin.github.io/portafolio-libro/">
    <meta property="og:image" content="https://dsrvin.github.io/portafolio-libro/assets/img/og-portada.jpg">
    <meta property="og:locale" content="es_PE">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/flipbook.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="scene">

        <!-- Botón flotante superior derecha -->
        <button class="btn-contact" id="btnContact" type="button">
            <span class="btn-contact-icon" aria-hidden="true"></span>
            Contáctanos
            <span class="btn-contact-arrow" aria-hidden="true"></span>
        </button>

        <!-- Menú móvil (las pestañas se convierten en drawer) -->
        <button class="menu-fab" id="menuFab" type="button" aria-label="Abrir menú de secciones" aria-expanded="false"></button>
        <div class="drawer" id="drawer" aria-hidden="true">
            <div class="drawer-head">
                <span class="drawer-title">Secciones</span>
                <button class="drawer-close" id="drawerClose" type="button" aria-label="Cerrar menú"></button>
            </div>
            <nav class="drawer-list" id="drawerList" aria-label="Menú de secciones"></nav>
        </div>
        <div class="drawer-veil" id="drawerVeil"></div>

        <!-- Escenario: el cuaderno sobre el escritorio -->
        <main class="stage" id="stage">
            <div class="notebook" id="notebook" data-state="cover">
                <!-- Pestañas ancladas al lomo (se desplazan con él) -->
                <div class="chrome" id="chrome">
                    <nav class="tabs" id="tabs" aria-label="Secciones del portafolio"></nav>
                </div>
                <!-- Grosor físico: contratapa dura y canto de hojas (visible cerrado) -->
                <div class="book-block" aria-hidden="true"></div>
                <!-- El libro (motor flipbook) -->
                <div id="book"></div>
            </div>

            <button class="edgenav prev" id="btnPrev" type="button" aria-label="Página anterior">&#8249;</button>
            <button class="edgenav next" id="btnNext" type="button" aria-label="Página siguiente">&#8250;</button>
        </main>

        <!-- Footer flotante, separado del cuaderno -->
        <footer class="footer">
            <div class="footer-card">
                <div class="stat">
                    <span class="stat-icon" data-icon="folder"></span>
                    <div class="stat-body">
                        <span class="stat-num" data-count="7" data-suffix="">0</span>
                        <span class="stat-label">Proyectos publicados</span>
                    </div>
                </div>
                <div class="stat">
                    <span class="stat-icon" data-icon="users"></span>
                    <div class="stat-body">
                        <span class="stat-num" data-count="4" data-suffix="">0</span>
                        <span class="stat-label">Áreas de servicio</span>
                    </div>
                </div>
                <div class="stat">
                    <span class="stat-icon" data-icon="calendar"></span>
                    <div class="stat-body">
                        <span class="stat-num" data-count="24" data-suffix="h">0</span>
                        <span class="stat-label">Tiempo de respuesta</span>
                    </div>
                </div>
                <div class="stat">
                    <span class="stat-icon" data-icon="chart"></span>
                    <div class="stat-body">
                        <span class="stat-num" data-count="0" data-suffix="">0</span>
                        <span class="stat-label">Compromiso inicial</span>
                    </div>
                </div>
                <div class="footer-quote">
                    <span class="quote-mark" aria-hidden="true">&ldquo;</span>
                    <p>El código es la herramienta.<br>Tu meta es <em>el resultado</em>.</p>
                    <span class="quote-mark end" aria-hidden="true">&rdquo;</span>
                </div>
            </div>
        </footer>

    </div>

    <script src="js/flipbook.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
